                yaxis_id: price
                type: line
                curve: stepline
                extend_to: false
                data_generator: |
                  return (entity.attributes.d || []).map(p => [p[0] * 1000, p[1]]);
              - entity: binary_sensor.opta_xxxxxx_relay4_output
                name: План реле 4
                yaxis_id: plan
                type: area
                curve: straight
                color: '#9aa0a6'
                opacity: 0.4
                extend_to: false
                data_generator: |
                  const points = [];
                  for (const [start, end] of entity.attributes.on || []) {
                    points.push([start * 1000, 0], [start * 1000, 1], [end * 1000, 1], [end * 1000, 0]);
                  }
                  return points;
