; Конфигурация PlatformIO: прошивка Opta и unit-тесты чистого ядра на ПК.
; Подробности — docs/DEVELOPMENT.md.

[platformio]
; `pio run` без -e собирает только прошивку: env:native не собирает src/
default_envs = opta

[env:opta]
platform = ststm32
board = opta
framework = arduino
monitor_speed = 115200
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.0
    arduino-libraries/ArduinoMqttClient @ ^0.1.8

; Unit-тесты модулей lib/ на ПК: pio test -e native
; Нужен компилятор хоста (MinGW-w64 на Windows), см. docs/DEVELOPMENT.md.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

; Опционально для работы со вторым ядром Cortex-M4:
; [env:opta_m4]
; platform = ststm32
; board = opta_m4
; framework = arduino
